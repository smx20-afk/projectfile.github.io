                <h1>My Python Project Code</h1>
                <button onclick="location.reload()">Go Back</button>
                <pre><code>import csv
import csv
import json
import os
import platform
import subprocess
import tkinter as tk
from groq import Groq
import pandas as pd
from tkinter import filedialog, messagebox, simpledialog

#OOP 
class Task:

    def __init__(self, task, time, budget):
        self.task = task
        self.time = time
        self.budget = budget
        self.notes = ""


tasks = set()
saved = {}
maininput = None
notetxt = None
saved2 = None
notew = None
found = False


def save_to_csv():
    try:
        file = open("tasks.csv", "w", newline="", encoding="utf-8")
        writer = csv.writer(file)

        writer.writerow(["Task", "Time", "Budget", "Notes"])
        for task in tasks:
            writer.writerow([task.task, task.time, task.budget, task.notes])
        file.close()

    except FileNotFoundError:
        print("File Not Found. Your changes will NOT be saved.")


def save_to_json():
    data = {"tasks": [], "saved": saved, "saved2": saved2}

    for task in tasks:
        data["tasks"].append(
            {
                "task": task.task,
                "time": task.time,
                "budget": task.budget,
                "notes": task.notes,
            }
        )

    with open("tasks.json", "w", encoding="utf-8") as file:
        json.dump(data, file, indent=4)


def loadtojson():

    global saved, saved2
    if not os.path.exists("tasks.json"):
        with open("tasks.json", "w", encoding="utf-8") as file:
            json.dump({"tasks": [], "saved": {}, "saved2": None}, file, indent=4)

    try:
        with open("tasks.json", "r", encoding="utf-8") as file:
            data = json.load(file)
            tasks.clear()

            for item in data["tasks"]:
                task = Task(item["task"], item["time"], item["budget"])

                task.notes = item["notes"]
                tasks.add(task)

            saved = data["saved"]
            saved2 = data["saved2"]

    except (FileNotFoundError, json.JSONDecodeError):
        print("No saved data found.")

#The Core Of It all
def create_task():
    while True:
        task_name = input("Enter task (Press Enter to stop): ").strip()
        if task_name == "":
            return

        time_text = input("Enter time in hours: ").strip()
        try:
            time = float(time_text)
            if time <= 0:
                print("Time must be greater than 0.")
                continue
        except ValueError:
            print("Please enter a valid time.")
            continue

        budget_text = input("Enter budget (optional): ").strip()
        if budget_text == "":
            budget = 0
        else:
            try:
                budget = float(budget_text)
                if budget < 0:
                    print("Budget cannot be negative.")
                    continue
            except ValueError:
                print("Please enter a valid budget.")
                continue

        task = Task(task_name, time, budget)
        tasks.add(task)
        print(f"Task {task_name} has been added to your list")
        save_to_json()
        save_to_csv()


def addtask():
    create_task()
    save_to_json()
    save_to_csv()


def edittask():
    global tasks
    found = False

    print("\n--- Current Available Tasks ---")
    if len(tasks) == 0:
        print("(No tasks currently in memory)")
    else:
        for task in tasks:
            print(f"- {task.task}")
    print("--------------------------------\n")

    option = input("""Do you want to 
    1. Edit a task 
    OR
    2. Remove a task: """)

    if option == "1":
        wtask = input("Enter the task you want to edit: ")

        for task in tasks:
            if task.task == wtask:
                found = True
                task.task = input("Enter the new task name: ")
                task.time = float(input("Enter the new task time: "))
                task.budget = input("Enter new budget (optional): ")

                save_to_csv()
                save_to_json()
                print("Task edited successfully.")
                break

        if not found:
            print("Cannot find task")

    elif option == "2":
        wtask2 = input("Enter the task you want to remove: ")

        for task in list(tasks):
            if task.task == wtask2:
                found = True
                tasks.remove(task)
                save_to_csv()
                save_to_json()
                print("Task removed successfully.")
                break

        if not found:
            messagebox.showinfo('Notice', 'Invalid input: Task not found')


def notessof():
    global notetxt, notew
    notew = tk.Tk()
    notew.title("Notes manager")
    notew.geometry("500x600")

    notetxt = tk.Text(notew, wrap="word")
    notetxt.pack(expand=True, fill="both", padx=10, pady=10)

    savebutton = tk.Button(notew, text="Save Notes to File", command=savetofile)
    savebutton.pack(pady=10)

    open_btn = tk.Button(notew, text="Import File", command=openfile)
    open_btn.pack(pady=10)
    load = tk.Button(notew, text="Load Steps", command=opentasks)
    load.pack(pady=10)
    save = tk.Button(notew, text="Save Steps", command=savesteps)
    save.pack(pady=10)

    notew.mainloop()
    main()


def savetofile():
    global tasks, saved, notetxt

    text = "Available Tasks:\n"
    for task in tasks:
        text = text + f" - {task.task}\n"

    wtask = simpledialog.askstring(
        "?", f"What task do you want to save to?\n\n{text}"
    )

    found_task = None
    for task in tasks:
        if task.task == wtask:
            found_task = task
            break

    if not found_task:
        messagebox.showinfo('Notice', 'Task not found')
        return

    filepath = filedialog.asksaveasfilename(
        defaultextension=".txt",
        filetypes=[("Text files", "*.txt"), ("All files", "*.*")],
    )

    if filepath:
        try:
            textcontent = notetxt.get("1.0", "end-1c")

            with open(filepath, "w", encoding="utf-8") as file:
                file.write(textcontent)

            saved[found_task.task] = filepath
            found_task.notes = filepath

            messagebox.showinfo('Notice', f"Notes saved: {filepath}")

        except Exception as e:
            messagebox.showinfo("Notice", f"Error saving file: {e}")


def savesteps():
    global saved2
    filepath2 = filedialog.asksaveasfilename(
        defaultextension=".txt",
        filetypes=[("Text files", "*.txt"), ("All files", "*.*")],
    )
    if filepath2:
        try:
            textcontent = notetxt.get("1.0", "end-1c")

            with open(filepath2, "w", encoding="utf-8") as file:
                file.write(textcontent)

            saved2 = filepath2

        except Exception as e:
            messagebox.showinfo("Notice", f"Error saving file: {e}")


def opentasks():
    global notetxt, saved2

    with open(saved2, "r", encoding="utf-8") as file:
        textcontent = file.read()

    notetxt.delete("1.0", "end")
    notetxt.insert("1.0", textcontent)


def openfile():
    global notetxt, saved

    text = "Available Tasks:\n"
    for task in tasks:
        text = text + f" - {task.task}\n"

    userinput = simpledialog.askstring(
        "?", f"What task do you want to save to?\n\n{text}"
    )

    if userinput in saved:
        saved_file = saved[userinput]

        with open(saved_file, "r", encoding="utf-8") as file:
            textcontent = file.read()

        notetxt.delete("1.0", "end")
        notetxt.insert("1.0", textcontent)

    else:
        messagebox.showinfo("Notice", "Task does not have a saved file or doesn't exist.")


def help():
    messagebox.showinfo(
        "How to use Task Manager", "Use the menu options to manage tasks."
    )

def aiorganize():
    while True:
        speak = input('Ask ai (press enter and nothing in the box to leave) : ')
        global tasks
        df = pd.read_csv('tasks.csv')
        api_key = "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"
        
        task_list_str = ""
        for t in tasks:
            task_list_str += f"Task Name: {t.task}, Hours: {t.time}, Budget: {t.budget}\n"

        print("\nConnecting to Groq AI... Please wait...")
        client = Groq(api_key=api_key)
        completion = client.chat.completions.create(
            # 🌟 Updated to a live, supported model ID:
            model="openai/gpt-oss-120b",
            messages=[
                {
                    "role": 'user',
                    'content': f'Now the user will ask you a question act like the user is talking to you not me and also this is your task chart info {task_list_str} also if the response is blank just say "bye hope your questions are answered": {speak}'
                },
                {
                    'role': 'user',
                    'content': f'Here is the list of tasks:\n{df}'
                }
            ]
        )
        print("\n=== Your Answer ===")
        print(completion.choices[0].message.content)  
        print("============================\n")
        if speak == '':
            return

def summary():
    current_os = platform.system()
    try:
        if current_os == "Windows":
            oo_path = r"C:\Program Files (x86)\OpenOffice 4\program\scalc.exe"
            if os.path.exists(oo_path):
                subprocess.Popen([oo_path, "tasks.csv"])
            else:
                os.startfile("tasks.csv")
        elif current_os == "Darwin":
            subprocess.Popen(["open", "-a", "OpenOffice", "tasks.csv"])
        else:
            subprocess.Popen(["xdg-open", "tasks.csv"])
    except Exception as e:
        print(f"Error: {e}")
def main():
    global maininput, tasks, saved, saved2, notetxt
    loadtojson()  
    
    if len(tasks) == 0:
        print("Found List Starting Program...")

    while True:
        print("\n--- Task Manager Menu ---")
        print("1. Add Tasks")
        print("2. Edit or Remove Tasks")
        print("3. Notes Manager")
        print("4. View Summary (OpenOffice)")
        print('5. Get tips from AI about organizing your set of tasks')
        print("6. Help")
        print("7. Exit")
        
        choice = input("Select an option (1-6): ").strip()
        
        if choice == "1":
            addtask()
        elif choice == "2":
            edittask()
        elif choice == "3":
            notessof()
        elif choice == "4":
            summary()
        elif choice == "5":
            aiorganize()
        elif choice == "6":
            help()
        elif choice == "7":
            print("Exiting Task Manager. Goodbye!")
            break
        else:
            print("Invalid selection. Please enter a number between 1 and 6.")


if __name__ == "__main__":
    main()

                </code></pre>
            `;
        }
    </script>
